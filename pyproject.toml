[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evecli-llm"
version = "0.1.0"
description = "A CLI backend for LLM assistants to manage EVE Online via the ESI API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">= 3.10"
authors = [
    { name = "ran", email = "3327004+Ranxy@users.noreply.github.com" },
]
keywords = ["eve-online", "esi", "cli", "llm", "eve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Ranxy/evecli"
Repository = "https://github.com/Ranxy/evecli"
"Bug Tracker" = "https://github.com/Ranxy/evecli/issues"

[project.scripts]
evecli = "evecli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evecli"]
